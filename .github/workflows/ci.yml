name: CI

on:
  push:
    branches:
      - main
      - refactor/unify-secure-storage
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type validation
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Browser tests
        run: pnpm test -- --run tests/indexeddb.repository.browser.test.ts
