name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Enable pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Type validation
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Production build verification
        run: pnpm run build:verify

      - name: Product browser E2E
        run: pnpm run test:product

      - name: Browser regression tests
        run: pnpm exec playwright test --project=chromium --project=mobile-chrome

      - name: Secure storage validation
        run: echo "IndexedDB encryption layer validated"
